name: solum
description: "Solum: the territory and follow-up app for solo field sellers."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.8
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_svg: ^2.3.2
  google_sign_in: ^7.2.0
  latlong2: ^0.10.1
  lucide_icons_flutter: ^4.0.3
  provider: ^6.1.5+1
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Official logo files (never retype the wordmark).
  assets:
    - brand/logos/solum-horizontal-full-color.svg
    - brand/logos/solum-horizontal-reverse.svg
    - brand/logos/solum-mark-full-color.svg
    - brand/logos/solum-mark-reverse.svg

  # Brand typeface (Open Font License). Files live in brand/fonts/.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: brand/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: brand/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: brand/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: brand/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
